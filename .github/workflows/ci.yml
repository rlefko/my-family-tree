name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: backend (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check src tests

  backend-test:
    name: backend (unit tests)
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -m "unit" --cov=my_family_tree --cov-report=xml -q

  frontend:
    name: frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  terraform:
    name: terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt -check
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: terraform validate (per env)
        run: |
          set -e
          for env in infra/terraform/envs/*; do
            echo "validating $env"
            (cd "$env" && terraform init -backend=false -input=false && terraform validate)
          done

  docker-build:
    name: docker (smoke build)
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image (smoke)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: my-family-tree-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image (smoke)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: my-family-tree-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
