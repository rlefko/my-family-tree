name: no-direct-push

on:
  push:
    branches: [main]

# Soft guardrail. Real prevention is GitHub branch protection
# (see scripts/setup-branch-protection.sh). This workflow makes accidental
# direct pushes to main highly visible.
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if push didn't come from a merged PR
        run: |
          if [ "${{ github.event.pusher.name }}" = "github-actions[bot]" ]; then
            echo "github-actions push: allowed"
            exit 0
          fi
          # Allow merge commits with the standard "Merge pull request" subject.
          subject="${{ github.event.head_commit.message }}"
          if [[ "$subject" == "Merge pull request"* ]]; then
            exit 0
          fi
          echo "::error::Direct pushes to main are discouraged. Open a PR instead."
          exit 1
