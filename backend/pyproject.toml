[project]
name = "my-family-tree"
version = "0.1.0"
description = "Personal genealogy research workbench"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Ryan Lefkowitz", email = "rlefkowitz1800@yahoo.com" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "starlette>=0.40",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.18",
  "sqlmodel>=0.0.22",
  "sqlalchemy[asyncio]>=2.0.41",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "httpx>=0.27",
  "boto3>=1.35",
  "arq>=0.26",
  "redis>=5.2",
  "openai>=1.55",
  "anthropic>=0.40",
  "python-gedcom>=1.0",
  "pytesseract>=0.3.13",
  "pillow>=11",
  "pypdfium2>=4.30",
  "pdfminer.six>=20240706",
  "tiktoken>=0.8",
  "mcp>=1.0",
  "typer>=0.13",
  "uuid-utils>=0.10",
  "chardet>=5.2",
  "rapidfuzz>=3.10",
  "geopy>=2.4",
  "selectolax>=0.3.21",
]

[dependency-groups]
dev = [
  "ruff>=0.7",
  "ty>=0.0.1a1",
  "pre-commit>=4",
  "ipython>=8.30",
]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6",
  "testcontainers[postgres,redis,minio]>=4.8",
  "respx>=0.22",
  "freezegun>=1.5",
  "asgi-lifespan>=2.1",
]

[project.scripts]
mft = "my_family_tree.cli.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_family_tree"]

[tool.uv]
package = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: fast tests that touch no external services",
  "integration: tests that require Postgres, Redis, or MinIO",
  "slow: tests that take more than a few seconds",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:botocore.*",
  "ignore::DeprecationWarning:aiobotocore.*",
  "ignore::PendingDeprecationWarning:starlette.*",
]
