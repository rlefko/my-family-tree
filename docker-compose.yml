name: my-family-tree

# Shared anchor for the three Python services. They all use the same image
# (different command). The bind-mount of `./backend:/app` is what gives us
# hot reload. The named `backend_venv:/app/.venv` mount is critical: without
# it the host bind would clobber the venv baked into the image (the host's
# .venv is built for macOS, the container's is Linux). With it, source files
# come from the host and dependencies stay from the image.
x-api-base: &api-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: .env
  environment:
    # Force polling watchers. inotify through macOS bind mounts is unreliable;
    # polling adds a small CPU cost in dev only and Just Works.
    WATCHFILES_FORCE_POLLING: "true"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  volumes:
    - ./backend:/app
    - backend_venv:/app/.venv
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-my_family_tree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-my_family_tree}
      POSTGRES_DB: ${POSTGRES_DB:-my_family_tree}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-my_family_tree}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-my-family-tree-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-my-family-tree-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-my-family-tree-local} ${S3_SECRET_KEY:-my-family-tree-local-secret} &&
      mc mb -p local/${S3_BUCKET_DOCUMENTS:-my-family-tree} || true &&
      echo 'minio bootstrap complete'"
    restart: "no"

  # FastAPI app. uvicorn `--reload` watches /app and restarts on .py changes.
  api:
    <<: *api-base
    command: uvicorn my_family_tree.api.app:create_app --factory --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    ports:
      - "8000:8000"

  # arq worker. `--watch /app/src` re-execs the worker on .py changes.
  worker:
    <<: *api-base
    command: arq my_family_tree.workers.arq_app.WorkerSettings --watch /app/src

  # MCP HTTP server. Wrapped in watchfiles so any change under src/ restarts.
  mcp:
    <<: *api-base
    command: >
      watchfiles
      "python -m my_family_tree.cli mcp --transport http --host 0.0.0.0 --port 8765"
      /app/src
    ports:
      - "8765:8765"

  # Vite dev server. HMR is built in. CHOKIDAR_USEPOLLING + WATCHPACK_POLLING
  # cover both watcher backends so file events survive the Docker Desktop
  # bind-mount path on macOS.
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "yarn install --frozen-lockfile && yarn dev --host 0.0.0.0"
    env_file: .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  backend_venv:
  frontend_node_modules:
